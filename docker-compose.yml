services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    # API_PROXY_URL is set at container startup (see apps/web/Dockerfile's
    # development CMD), not hardcoded here -- it must match whether api is
    # actually serving HTTPS or HTTP at that moment (see apps/api/src/app.ts),
    # which depends on whether the cert was minted before the containers were
    # created. The proxy itself (vite.config.ts) sets secure: false for this hop
    # regardless, since the cert doesn't cover the 'api' hostname anyway.
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # Leaf cert only, read-only, mounted file-by-file rather than as a
      # directory: the CA root that signs it (rootCA-key.pem) lives outside the
      # repo in ~/.vite-plugin-mkcert and must never reach a container -- it can
      # mint certs the host browser trusts for ANY domain. Run
      # `pnpm generate:certificates` on the host first (docker:up / docker:rebuild
      # do it for you); until then these files don't exist and the container
      # serves HTTP. See "Local HTTPS certs" in DOCKER.md.
      - ./.certs/dev.pem:/app/.certs/dev.pem:ro
      - ./.certs/cert.pem:/app/.certs/cert.pem:ro
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://root:root@postgres:5432/monorepo_fastify_vue
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      # Same leaf-only, read-only pair as web/site (see apps/api/src/app.ts).
      - ./.certs/dev.pem:/app/.certs/dev.pem:ro
      - ./.certs/cert.pem:/app/.certs/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NITRO_PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - ./apps/site/app:/app/apps/site/app
      # Same leaf-only, read-only pair as web (see apps/site/nuxt.config.ts).
      - ./.certs/dev.pem:/app/.certs/dev.pem:ro
      - ./.certs/cert.pem:/app/.certs/cert.pem:ro

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: monorepo_fastify_vue
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d monorepo_fastify_vue']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  drizzle-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    command: pnpm --filter @monorepo-fastify-vue/api exec drizzle-kit studio --host 0.0.0.0
    environment:
      DATABASE_URL: postgresql://root:root@postgres:5432/monorepo_fastify_vue
    ports:
      - '4983:4983'
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
