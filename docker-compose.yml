services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    # API_PROXY_URL is set at container startup (see apps/web/Dockerfile's
    # development CMD), not hardcoded here -- it must match whether api is
    # actually serving HTTPS or HTTP at that moment (see apps/api/src/app.ts),
    # which depends on whether .certs/ exists yet on a given clone. The
    # proxy itself (vite.config.ts) sets secure: false for this hop regardless,
    # since the cert doesn't cover the 'api' hostname anyway.
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # Reuses the repo's locally-trusted mkcert CA (gitignored, holds a
      # private key -- see .gitignore) instead of generating a new one inside
      # the container -- see vite.config.ts. Requires having run a dev server
      # on the host (or this container) at least once so .certs/ exists.
      - ./.certs:/app/.certs
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://root:root@postgres:5432/monorepo_fastify_vue
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      # Same cert as web/site (see apps/api/src/app.ts).
      - ./.certs:/app/.certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NITRO_PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - ./apps/site/app:/app/apps/site/app
      # Same cert as web (see apps/site/nuxt.config.ts).
      - ./.certs:/app/.certs
    depends_on:
      # Advisory only: nuxt.config.ts checks .certs/ once at config load, and
      # `depends_on` only waits for web's container to *start*, not for web to
      # actually finish minting the cert -- so this narrows, but doesn't
      # close, the window where site starts HTTP-only on a fresh clone. See
      # "Local HTTPS certs" in DOCKER.md.
      - web

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: monorepo_fastify_vue
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d monorepo_fastify_vue']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  drizzle-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    command: pnpm --filter @monorepo-fastify-vue/api exec drizzle-kit studio --host 0.0.0.0
    environment:
      DATABASE_URL: postgresql://root:root@postgres:5432/monorepo_fastify_vue
    ports:
      - '4983:4983'
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
